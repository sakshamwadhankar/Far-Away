[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralflow-backend"
version = "0.1.0"
description = "NeuralFlow backend — FastAPI execution engine for multi-model LLM pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.13.4",
    "keyring==25.6.0",
    "httpx==0.28.1",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-genai>=0.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.1.0",
    "httpx-ws>=0.4.2",
    "ruff==0.11.13",
    "black==25.1.0",
    "mypy==1.16.0",
    "jsonschema==4.23.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated per-request by the
# framework, not shared across calls, so B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Security",
]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true

# Third-party model SDKs. `google-genai` ships no py.typed marker at all, and
# the three SDKs are optional at import time (CloudEndpoint imports them lazily
# per provider), so a dev box without them installed must still typecheck.
# `follow_imports = "skip"` makes the result identical whether or not the SDK is
# present, so local runs and CI agree.
# TODO(typing): drop follow_imports once these SDKs ship stable stubs and we
# want the extra checking at the endpoint boundary.
[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"
