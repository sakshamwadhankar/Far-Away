[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralflow-backend"
version = "0.1.0"
description = "NeuralFlow backend — FastAPI execution engine for multi-model LLM pipelines"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.13.4",
    "keyring==25.6.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.1.0",
    "ruff==0.11.13",
    "black==25.1.0",
    "mypy==1.16.0",
    "jsonschema==4.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neuralflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
