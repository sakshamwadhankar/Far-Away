name: Verify

on:
  workflow_call:

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/desktop/package-lock.json

    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint backend (ruff)
      working-directory: backend
      run: ruff check .

    - name: Typecheck backend (mypy --strict)
      working-directory: backend
      run: mypy komvos

    - name: Test backend (pytest)
      working-directory: backend
      run: pytest -q --cov=komvos

    - name: Install frontend dependencies
      working-directory: apps/desktop
      run: npm ci

    - name: Typecheck frontend
      working-directory: apps/desktop
      run: npm run typecheck

    - name: Lint frontend
      working-directory: apps/desktop
      run: npm run lint

    - name: Test frontend
      working-directory: apps/desktop
      run: npm run test

    - name: Install Playwright browsers
      working-directory: apps/desktop
      run: npx playwright install --with-deps chromium

    - name: Test frontend E2E (Playwright)
      working-directory: apps/desktop
      run: npm run test:e2e

  # Non-blocking for now: surfaces vulnerabilities without failing builds.
  # Review findings each run; flip continue-on-error to false once the known
  # dev-toolchain advisories are cleared.
  deps-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install backend dependencies and pip-audit
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pip-audit

    - name: Audit Python dependencies (pip-audit)
      working-directory: backend
      run: pip-audit --skip-editable

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/desktop/package-lock.json

    - name: Audit npm production dependencies
      working-directory: apps/desktop
      run: npm audit --omit=dev --audit-level=low

    - name: Audit npm full tree (informational, includes dev toolchain)
      working-directory: apps/desktop
      run: npm audit --audit-level=low
