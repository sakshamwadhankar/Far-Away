appId: com.neuralflow.desktop
productName: NeuralFlow
directories:
  output: release
  buildResources: build

files:
  - dist-electron/**/*
  - dist/**/*
  - package.json

extraResources:
  - from: ../packaging/dist/neuralflow-backend
    to: neuralflow-backend
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization will be configured here or in afterSign hook via environment variables
  # e.g., using @electron/notarize

win:
  target:
    - target: nsis
      arch:
        - x64
  # Signing is handled via env vars WIN_SIGN_KEY by electron-builder

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
